{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10233f">
    <meta name="description" content="وبلاگ شخصی؛ نوشته‌ها، آموزش‌ها و تجربه‌ها">
    <title>{% block title %}وبلاگ من{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/body.css' %}">
    {% block head %}{% endblock %}
</head>
<body>
    <a class="skip-link" href="#main-content">رفتن به محتوای اصلی</a>
    <div class="site-shell">
        {% include "blog/partials/header.html" %}
        {% include "blog/partials/navigation.html" %}

        <main id="main-content" class="main-content">
            {% block content %}{% endblock %}
        </main>

        {% include "blog/partials/footer.html" %}
    </div>
    
    <script src="{% static 'js/script.js' %}" defer></script>
</body>
</html>
